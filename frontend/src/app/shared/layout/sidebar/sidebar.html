<aside>
  <a class="brand" [routerLink]="identity.home()">
    <span class="brand-mark"><app-icon name="shield" /></span>
    <span>ClaimFlow</span>
  </a>
  <nav aria-label="Workspace">
    @if (identity.current().role === 'claimant') {
      <a routerLink="/claimant" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">
        <app-icon name="overview" /> Overview
      </a>
      <a routerLink="/claimant/claims/new" routerLinkActive="active" ariaCurrentWhenActive="page">
        <app-icon name="plus" /> Submit Claim
      </a>
      <a routerLink="/claimant/claims" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">
        <app-icon name="claims" /> My Claims
      </a>
    } @else {
      <a routerLink="/officer/claims" routerLinkActive="active" ariaCurrentWhenActive="page">
        <app-icon name="claims" /> Claims worklist
      </a>
      <a routerLink="/management" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">
        <app-icon name="team" /> Management
      </a>
    }
  </nav>
  <div class="sidebar-foot">Insurance claims workspace</div>
</aside>
